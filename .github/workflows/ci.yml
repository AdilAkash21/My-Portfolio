name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type Check
        run: npm run typecheck || echo "TypeScript check failed, please fix types"

      - name: Run Tests
        run: npm run test || echo "Some tests failed, check logs"

      - name: Build Project
        run: npm run build
