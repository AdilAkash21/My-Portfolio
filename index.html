<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Adil Rahman Akash — Software Engineer & Web Developer</title>
    <meta name="description" content="Portfolio of Adil Rahman Akash — Software Engineer & Web Developer building functional, beautiful digital experiences." />
    <meta name="author" content="Adil Rahman Akash" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Adil Rahman Akash — Software Engineer & Web Developer" />
    <meta property="og:description" content="Portfolio of Adil Rahman Akash — Software Engineer & Web Developer building functional, beautiful digital experiences." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@adilrahmanakash" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" /></noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
    <script>
      // Sync theme class before first paint — defaults to "dark" for new visitors
      (function(){var t=localStorage.getItem('theme');if(!t||!['dark','batman'].includes(t)){t='dark';localStorage.setItem('theme','dark')}document.documentElement.className=t})();
    </script>
    <style>
      /* ── Skeleton shell ── */
      #root-skeleton{background:#111521;color:#d4d9e3;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono','Space Mono',monospace;transition:background .3s}
      html.batman #root-skeleton{background:#0d0d0f}
      #root-skeleton .sk-wrap{text-align:center;padding:2rem}
      #root:not(:empty)+#root-skeleton{display:none}

      /* ── Show/hide variants based on theme ── */
      .sk-dark{display:block}
      .sk-batman{display:none}
      html.batman .sk-dark{display:none}
      html.batman .sk-batman{display:block}

      /* ── Dark variant quote ── */
      .sk-quote{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
      .sk-word{font-size:1.6rem;font-weight:600;letter-spacing:.04em;opacity:0;animation:sk-pop .5s ease-out forwards}
      .sk-word:nth-child(1){animation-delay:.2s;color:#58c4dc}
      .sk-word:nth-child(2){animation-delay:.4s;color:#6b7a90}
      .sk-word:nth-child(3){animation-delay:.6s;color:#58c4dc}
      .sk-word:nth-child(4){animation-delay:.8s;color:#6b7a90}
      .sk-dot{color:#58c4dc;opacity:.5;font-size:1.2rem;align-self:center;animation:sk-pop .5s ease-out forwards}
      .sk-dot:nth-child(2){animation-delay:.3s}
      .sk-dot:nth-child(4){animation-delay:.5s}
      .sk-dot:nth-child(6){animation-delay:.7s}
      .sk-line{width:120px;height:2px;background:linear-gradient(90deg,transparent,#58c4dc,transparent);margin:0 auto 1.2rem;opacity:0;animation:sk-fade .6s .9s ease-out forwards}
      .sk-sub{font-size:.8rem;color:#4a5568;letter-spacing:.15em;text-transform:uppercase;opacity:0;animation:sk-fade .5s 1.1s ease-out forwards}
      .sk-loader{display:flex;gap:6px;justify-content:center;margin-top:1.5rem;opacity:0;animation:sk-fade .4s 1.3s ease-out forwards}
      .sk-loader span{width:6px;height:6px;border-radius:50%;background:#58c4dc;animation:sk-bounce .8s ease-in-out infinite alternate}
      .sk-loader span:nth-child(2){animation-delay:.15s}
      .sk-loader span:nth-child(3){animation-delay:.3s}

      /* ── Batman variant ── */
      .sk-bat-icon{width:72px;height:72px;margin:0 auto 1.4rem;opacity:0;animation:sk-pop .7s .1s ease-out forwards;filter:drop-shadow(0 0 14px rgba(212,160,23,.5))}
      .sk-bat-icon path{fill:#d4a017}
      .sk-bat-pulse{animation:sk-bat-glow 2s 1.2s ease-in-out infinite alternate}
      @keyframes sk-bat-glow{0%{filter:drop-shadow(0 0 8px rgba(212,160,23,.4))}100%{filter:drop-shadow(0 0 24px rgba(212,160,23,.9))}}

      .sk-bq{display:flex;flex-direction:column;align-items:center;gap:.3rem;margin-bottom:1.5rem}
      .sk-bword{font-size:1.4rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:0;animation:sk-pop .5s ease-out forwards}
      .sk-bword:nth-child(1){animation-delay:.3s;color:#d4a017}
      .sk-bword:nth-child(2){animation-delay:.55s;color:#c8b57a}
      .sk-bword:nth-child(3){animation-delay:.8s;color:#d4a017}
      .sk-bline{width:100px;height:1px;background:linear-gradient(90deg,transparent,#d4a017,transparent);margin:0 auto 1rem;opacity:0;animation:sk-fade .6s 1s ease-out forwards}
      .sk-bsub{font-size:.75rem;color:#5a4e2d;letter-spacing:.2em;text-transform:uppercase;opacity:0;animation:sk-fade .5s 1.2s ease-out forwards}
      .sk-bloader{display:flex;gap:6px;justify-content:center;margin-top:1.4rem;opacity:0;animation:sk-fade .4s 1.4s ease-out forwards}
      .sk-bloader span{width:5px;height:5px;border-radius:50%;background:#d4a017;animation:sk-bounce .9s ease-in-out infinite alternate}
      .sk-bloader span:nth-child(2){animation-delay:.2s}
      .sk-bloader span:nth-child(3){animation-delay:.4s}

      /* ── Shared keyframes ── */
      @keyframes sk-pop{0%{opacity:0;transform:scale(.7) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes sk-fade{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes sk-bounce{0%{transform:translateY(0);opacity:.4}100%{transform:translateY(-8px);opacity:1}}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="root-skeleton"><div class="sk-wrap">
      <div class="sk-quote">
        <span class="sk-word">Eat</span><span class="sk-dot">·</span>
        <span class="sk-word">Sleep</span><span class="sk-dot">·</span>
        <span class="sk-word">Code</span><span class="sk-dot">·</span>
        <span class="sk-word">Repeat</span>
      </div>
      <div class="sk-line"></div>
      <p class="sk-sub">Loading experience</p>
      <div class="sk-loader"><span></span><span></span><span></span></div>
    </div></div>
    <!-- Preload LCP image so browser discovers it before JS executes -->
    <img src="/src/assets/logo-ara.png" alt="" fetchpriority="high" decoding="async" style="position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
